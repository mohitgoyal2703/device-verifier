<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  <style>
    body {
      background: #18222d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-left-color: #2481cc;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { margin: 0 0 10px; font-size: 20px; }
    p { color: #8293a1; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h2 id="status">Verifying Device...</h2>
  <p id="subtext">Please wait a moment while we verify your device.</p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    FingerprintJS.load()
      .then(fp => fp.get())
      .then(result => {
        const hash = result.visitorId;
        document.getElementById('status').innerText = "Device Verified!";
        document.getElementById('subtext').innerText = "Returning to bot...";
        
        // Send data back to the bot
        tg.sendData(JSON.stringify({ device_hash: hash }));
        
        setTimeout(() => {
          tg.close();
        }, 300);
      })
      .catch(err => {
        document.getElementById('status').innerText = "Verification Failed";
        document.getElementById('subtext').innerText = "Please close and try again.";
      });
  </script>
</body>
</html>
