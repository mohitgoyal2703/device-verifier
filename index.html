<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Device Check</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
</head>
<body style="background:#111;color:#fff;text-align:center;font-family:sans-serif;padding-top:40px;">
  <p>Checking device integrity...</p>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    // Calculate unique device hardware fingerprint
    FingerprintJS.load().then(fp => fp.get()).then(result => {
      // Send the device fingerprint back to your bot and close popup
      tg.sendData(JSON.stringify({ device_hash: result.visitorId }));
      tg.close();
    }).catch(() => {
      tg.sendData(JSON.stringify({ error: "failed" }));
      tg.close();
    });
  </script>
</body>
</html>
