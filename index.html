<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border-left-color: #38bdf8;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px 0; font-size: 19px; }
    p { color: #94a3b8; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="status">Verifying Device...</h2>
    <p id="subtext">Please wait a moment...</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    async function runVerification() {
      try {
        const fp = await FingerprintJS.load();
        const result = await fp.get();
        const hash = result.visitorId;

        document.getElementById('status').innerText = "✅ Verified!";
        document.getElementById('subtext').innerText = "Returning to bot...";

        // Send hardware hash to Telegram bot
        tg.sendData(JSON.stringify({ device_hash: hash }));
      } catch (err) {
        document.getElementById('status').innerText = "⚠️ Retry Verification";
        document.getElementById('subtext').innerText = "Could not generate device ID.";
        tg.sendData(JSON.stringify({ error: "failed" }));
      }
    }

    // Execute automatically on load
    runVerification();
  </script>
</body>
</html>
