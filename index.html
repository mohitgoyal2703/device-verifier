<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #38bdf8;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px 0; font-size: 18px; }
    p { color: #94a3b8; font-size: 14px; margin: 0; }
    .btn {
      margin-top: 16px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="status">Verifying Device...</h2>
    <p id="subtext">Calculating device hash...</p>
    <button class="btn" id="confirmBtn" onclick="submitHash()">Confirm Verification</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let computedHash = null;

    function submitHash() {
      if (computedHash) {
        tg.sendData(JSON.stringify({ device_hash: computedHash }));
      }
    }

    FingerprintJS.load()
      .then(fp => fp.get())
      .then(result => {
        computedHash = result.visitorId;
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').innerText = "✅ Device Checked";
        document.getElementById('subtext').innerText = "Click below to complete verification";
        
        // Try direct sendData
        try {
          tg.sendData(JSON.stringify({ device_hash: computedHash }));
        } catch (e) {
          document.getElementById('confirmBtn').style.display = 'block';
        }
      })
      .catch(() => {
        document.getElementById('status').innerText = "⚠️ Retry Verification";
        document.getElementById('subtext').innerText = "Could not generate device ID.";
      });
  </script>
</body>
</html>
